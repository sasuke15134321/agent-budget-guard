openapi: "3.1.0"
info:
  title: Agent Budget Guard API
  version: "1.0.0"
  description: >
    Use this API before every x402 payment or API call.
    Checks if AI agent should pay based on budget limits,
    anomaly detection, and USDC/JPYC spending caps.
    Essential for Japanese enterprise AI agent deployments.
    Prevents runaway spending and unauthorized payments.
    Also supports duplicate lookup prevention and market data budget control for AI agents using paid data APIs.
  x-guidance: "Use this API before every x402 USDC or JPYC payment. L4 budget control, Japan invoice compliance."
servers:
  - url: https://agent-budget-guard.onrender.com
    description: Production (Render)

paths:
  /api/budget/check:
    post:
      operationId: check_budget
      summary: Check if AI agent should pay for an API call
      description: >
        Use this before any x402 payment.
        Verifies daily budget, per-call limits,
        anomaly patterns, and JPYC/USDC caps.
        Returns allow/deny with reason.
      tags: [Budget]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.03"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCheckRequest'
            example:
              agent_id: "agent-001"
              api_url: "https://agent-memory-api-bix5.onrender.com"
              amount_usdc: 0.05
              category: "infrastructure"
              daily_limit: 5.00
      responses:
        '200':
          description: Budget check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetCheckResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/budget/record:
    post:
      operationId: record_payment
      summary: Record a completed payment for audit
      description: >
        Call this after every x402 payment.
        Records payment history for audit logs,
        CSV export, and accounting purposes.

      tags: [Budget]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordTransactionRequest'
            example:
              agent_id: "agent-001"
              api_url: "https://agent-memory-api-bix5.onrender.com"
              amount_usdc: 0.05
              transaction_id: "tx_abc123"
              category: "infrastructure"
      responses:
        '200':
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordTransactionResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/budget/report/{agent_id}:
    get:
      summary: Get agent spending report
      description: >
        Returns daily/monthly spend, transaction history,
        budget utilization, and risk assessment for a specific agent.
      tags: [Budget]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.05"
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
          example: "agent-001"
      responses:
        '200':
          description: Agent spending report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReportResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/budget/stats:
    get:
      summary: Get budget statistics
      description: Returns aggregate spending stats across all agents (free endpoint).
      tags: [Stats]
      responses:
        '200':
          description: Budget statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetStatsResponse'

  /api/record-payment:
    post:
      operationId: record_payment_invoice
      summary: Record payment transaction and classify for invoice
      description: >
        Use after x402 JPYC or USDC payment is completed.
        Records tx and determines if small-amount invoice exception applies.
        Tax-included amounts under 10,000 JPY qualify for bookkeeping-only treatment
        under Japan invoice special exception (2023-2029).
      tags: [Invoice]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, amount, currency, tax_included_amount_jpy, network, tx_hash, purpose]
              properties:
                agent_id:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                tax_included_amount_jpy:
                  type: number
                network:
                  type: string
                tx_hash:
                  type: string
                purpose:
                  type: string
            example:
              agent_id: "agent-001"
              amount: 0.01
              currency: "JPYC"
              tax_included_amount_jpy: 1500
              network: "polygon-mainnet"
              tx_hash: "0xabc123"
              purpose: "API consultation fee"
      responses:
        '200':
          description: Payment recorded with invoice classification
          content:
            application/json:
              example:
                recorded: true
                audit_id: "audit_1234567890"
                invoice_required: false
                reason: "small-amount exception candidate"
                bookkeeping_required: true
                monthly_summary_required: true
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/classify-invoice:
    post:
      operationId: classify_invoice
      summary: Classify invoice requirement for JPYC x402 micro-payment
      description: >
        Determines if a transaction requires a qualified invoice under Japan invoice system.
        Small-amount exception applies to tax-included amounts under 10,000 JPY
        for eligible buyers (taxable sales under 100M JPY).
      tags: [Invoice]
      security:
        - x402Payment: []
      x-payment-info:
        protocols:
          - x402
        authMode: x402
        price:
          mode: fixed
          currency: USDC
          amount: "0.01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer_taxable_sales_jpy, transaction_amount_tax_included_jpy, transaction_date, seller_invoice_registered]
              properties:
                buyer_taxable_sales_jpy:
                  type: number
                transaction_amount_tax_included_jpy:
                  type: number
                transaction_date:
                  type: string
                seller_invoice_registered:
                  type: boolean
            example:
              buyer_taxable_sales_jpy: 50000000
              transaction_amount_tax_included_jpy: 1500
              transaction_date: "2026-05-13"
              seller_invoice_registered: true
      responses:
        '200':
          description: Invoice classification result
          content:
            application/json:
              example:
                invoice_required: false
                bookkeeping_only: true
                reason: "small-amount exception applies (under 10,000 JPY, buyer taxable sales under 100M JPY)"
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequired'

  /api/monthly-summary:
    get:
      operationId: get_monthly_summary
      summary: Get monthly payment summary for accounting
      description: >
        Returns monthly aggregation of x402 JPYC/USDC payments.
        Separates small-amount exception transactions from invoice-required ones.
        Use for monthly bookkeeping and accounting export.
        This endpoint is free (no x402 payment required).
      tags: [Invoice]
      parameters:
        - name: buyer_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by buyer agent ID
        - name: month
          in: query
          required: false
          schema:
            type: string
          description: "Month in YYYY-MM format (e.g. 2026-05)"
      responses:
        '200':
          description: Monthly payment summary
          content:
            application/json:
              example:
                buyer_id: "agent-001"
                month: "2026-05"
                total_transactions: 0
                total_amount_jpy: 0
                small_amount_exception_count: 0
                invoice_required_count: 0
                note: "Summary feature coming soon. Tx recording via /api/record-payment."

  /api/spending-policy/build:
    post:
      operationId: build_spending_policy
      summary: Agent Spending Policy Builder (free, stateless, experimental)
      description: >
        Creates a structured AI-agent spending policy with limits, allowed currencies,
        allowed services, approval rules, context state, and Atom-compatible reference.
        Free builder — no x402 payment required. No DB storage. Stateless.
      tags: [Policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                policy_name:
                  type: string
                limits:
                  type: object
                allowed_services:
                  type: array
                  items:
                    type: string
                approval_rules:
                  type: object
                context_state:
                  type: object
                token_budget:
                  type: object
                  properties:
                    max_tokens_per_decision:
                      type: integer
                      default: 8000
                    max_tokens_per_paid_api_selection:
                      type: integer
                      default: 3000
                    max_tokens_before_human_review:
                      type: integer
                      default: 12000
                    allow_extra_reasoning_if_payment_required:
                      type: boolean
                      default: false
                memory_scope_policy:
                  type: object
                  properties:
                    allowed_memory_scopes:
                      type: array
                      items:
                        type: string
                    blocked_memory_scopes:
                      type: array
                      items:
                        type: string
                    require_freshness_check:
                      type: boolean
                      default: true
                    require_source_of_truth_before_payment:
                      type: boolean
                      default: true
                reasoning_cost_boundary:
                  type: object
                  properties:
                    max_retries_before_review:
                      type: integer
                      default: 2
                    max_tool_comparisons:
                      type: integer
                      default: 3
                    require_cost_trace:
                      type: boolean
                      default: true
                    block_if_context_state_unknown:
                      type: boolean
                      default: true
                human_review_triggers:
                  type: object
                  properties:
                    trigger_if_token_budget_exceeded:
                      type: boolean
                      default: true
                    trigger_if_memory_scope_uncertain:
                      type: boolean
                      default: true
                    trigger_if_payment_and_memory_conflict:
                      type: boolean
                      default: true
                    trigger_if_source_of_truth_missing:
                      type: boolean
                      default: true
            example:
              agent_id: "agent-001"
              policy_name: "my-spending-policy"
              limits:
                max_amount_per_payment: "0.10"
                daily_budget: "1.00"
                monthly_budget: "10.00"
                allowed_currencies: ["USDC"]
              allowed_services: ["agent-security-gateway.onrender.com"]
              approval_rules:
                human_approval_required_above: "0.50"
                block_unknown_counterparty: true
                require_payment_evidence: true
                require_budget_check: true
              context_state:
                status: "active"
                use_rule: "enforce"
                evidence: "none"
                last_checked: null
              token_budget:
                max_tokens_per_decision: 8000
                max_tokens_per_paid_api_selection: 3000
                max_tokens_before_human_review: 12000
                allow_extra_reasoning_if_payment_required: false
              memory_scope_policy:
                allowed_memory_scopes: ["current_task", "confirmed_project_status", "source_of_truth_files"]
                blocked_memory_scopes: ["stale_conversation", "unverified_assumption", "sensitive_memory"]
                require_freshness_check: true
                require_source_of_truth_before_payment: true
              reasoning_cost_boundary:
                max_retries_before_review: 2
                max_tool_comparisons: 3
                require_cost_trace: true
                block_if_context_state_unknown: true
              human_review_triggers:
                trigger_if_token_budget_exceeded: true
                trigger_if_memory_scope_uncertain: true
                trigger_if_payment_and_memory_conflict: true
                trigger_if_source_of_truth_missing: true
      responses:
        '200':
          description: Spending policy created
          content:
            application/json:
              example:
                policy_id: "spending_policy_<uuid>"
                policy_type: "agent_spending_policy"
                status: "created"
                experimental: true
                stateless: true
                free_builder: true
                agent_id: "agent-001"
                policy_name: "my-spending-policy"
                token_budget:
                  max_tokens_per_decision: 8000
                  max_tokens_per_paid_api_selection: 3000
                  max_tokens_before_human_review: 12000
                  allow_extra_reasoning_if_payment_required: false
                memory_scope_policy:
                  allowed_memory_scopes: ["current_task", "confirmed_project_status", "source_of_truth_files"]
                  blocked_memory_scopes: ["stale_conversation", "unverified_assumption", "sensitive_memory"]
                  require_freshness_check: true
                  require_source_of_truth_before_payment: true
                reasoning_cost_boundary:
                  max_retries_before_review: 2
                  max_tool_comparisons: 3
                  require_cost_trace: true
                  block_if_context_state_unknown: true
                human_review_triggers:
                  trigger_if_token_budget_exceeded: true
                  trigger_if_memory_scope_uncertain: true
                  trigger_if_payment_and_memory_conflict: true
                  trigger_if_source_of_truth_missing: true
                agent_action_atom:
                  atom_type: "spending_policy_created"
                  action_type: "policy_build"
                  target: "agent_spending_policy"
                  audit_ready: true
                  includes:
                    - "spending_limits"
                    - "approval_rules"
                    - "token_budget"
                    - "memory_scope_policy"
                    - "reasoning_cost_boundary"
                    - "human_review_triggers"
                  note: "Atom-compatible reference. This builder does not call the external Action Atom Builder."
                can_feed_into:
                  - "Budget Check"
                  - "Agent Action Atom"
                  - "Agent Payment Action Record"
                  - "Payment Control Evidence Packet"
                  - "Decision Cost Trace"
                  - "Memory Provenance Graph"
                  - "Token Placement Governance"
                non_goals:
                  - "not a model provider"
                  - "not a memory store"
                  - "not a payment protocol"
                  - "not a settlement layer"
                  - "not a wallet"
                  - "not a legal compliance system"
                  - "not an official standard"

  /.well-known/x402.json:
    get:
      summary: x402 endpoint discovery
      description: Lists all paid endpoints with pricing for Agentic.Market discovery.
      tags: [Discovery]
      responses:
        '200':
          description: x402 discovery manifest

  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: Service health status

components:
  securitySchemes:
    x402Payment:
      type: apiKey
      in: header
      name: X-PAYMENT
      description: >
        x402 USDC payment token on Base Mainnet.
        Omit when TEST_MODE=true (development).

  schemas:
    BudgetCheckRequest:
      type: object
      required: [agent_id, api_url, amount_usdc]
      properties:
        agent_id:
          type: string
          description: Agent identifier
        api_url:
          type: string
          description: Target API URL for the payment
        amount_usdc:
          type: number
          description: Payment amount in USDC
        category:
          type: string
          enum: [infrastructure, security, consulting]
          default: infrastructure
        daily_limit:
          type: number
          default: 5.00
          description: Daily spend limit in USDC

    BudgetCheckResponse:
      type: object
      properties:
        approved:
          type: boolean
        reason:
          type: string
        current_daily_spend:
          type: number
        remaining_budget:
          type: number
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        warnings:
          type: array
          items:
            type: string
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    RecordTransactionRequest:
      type: object
      required: [agent_id, api_url, amount_usdc, transaction_id]
      properties:
        agent_id:
          type: string
        api_url:
          type: string
        amount_usdc:
          type: number
        transaction_id:
          type: string
        category:
          type: string
          default: infrastructure

    RecordTransactionResponse:
      type: object
      properties:
        recorded:
          type: boolean
        total_today:
          type: number
        total_this_month:
          type: number
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    AgentReportResponse:
      type: object
      properties:
        agent_id:
          type: string
        daily_spend:
          type: number
        monthly_spend:
          type: number
        transactions:
          type: array
          items:
            type: object
        budget_utilization:
          type: number
        risk_assessment:
          type: string
        next_recommended:
          $ref: '#/components/schemas/NextRecommendation'

    BudgetStatsResponse:
      type: object
      properties:
        total_agents:
          type: integer
        daily_spending:
          type: object
        top_apis:
          type: array
          items:
            type: object
        anomalies_detected:
          type: array
          items:
            type: object

    NextRecommendation:
      type: object
      properties:
        api_name:
          type: string
        url:
          type: string
        reason:
          type: string
        expected_improvement:
          type: string
        price_usdc:
          type: number

    PaymentRequired:
      type: object
      properties:
        error:
          type: string
          example: Payment Required
        price:
          type: string
          example: "0.03"
        currency:
          type: string
          example: USDC
        network:
          type: string
          example: base-mainnet
        payTo:
          type: string
          example: "0x60c402878EfcEcAe5733A88075328Aa2320C39BE"
        endpoint:
          type: string
